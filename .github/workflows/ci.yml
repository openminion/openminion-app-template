name: CI

on:
  pull_request:
  push:
    branches: [dev]

jobs:
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: release-0.1.24
            requirement: openminion==0.1.24
          - target: dev-9afefc42
            requirement: git+https://github.com/openminion/openminion.git@9afefc42f
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "${{ matrix.requirement }}"
      - run: python -m pip install -e ".[dev]"
      - run: python -c "import openminion; from openminion.api import TurnChunk; print(openminion.__version__, TurnChunk(trace_id='ci', kind='status').schema_version)"
      - run: ruff check .
      - run: pytest -m "not live"
      - run: python -m pip check

  app-data-rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install git+https://github.com/openminion/openminion.git@9afefc42f
      - run: python -m pip install -e .
      - run: python -c "from openminion_app_template.domain import RequestStore; RequestStore('rollback.db').create('saved', 'keep this record')"
      - run: python -m pip install --force-reinstall openminion==0.1.24
      - run: python -c "from openminion_app_template.domain import RequestStore; record = RequestStore('rollback.db').get('saved'); assert record and record.prompt == 'keep this record'"
